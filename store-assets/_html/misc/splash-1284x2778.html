<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:1284px;height:2778px;overflow:hidden}
body{position:relative;font-family:'Inter',sans-serif;
  background:radial-gradient(110% 60% at 50% 40%,#0e2a1c 0%,#061710 46%,#03100a 100%)}
.center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
.badge{width:302px;height:302px;margin:0 auto 83px;
  border-radius:80px;position:relative;
  background:linear-gradient(150deg,#1a4e34,#0e2a1d);border:1.5px solid rgba(216,180,106,.4);
  box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 40px rgba(233,207,154,.12);
  display:grid;place-items:center}
.badge svg{width:56%;height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.4))}
.wm{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:110px;color:#f5edd9;letter-spacing:.01em}
.cl{font-size:28px;letter-spacing:.4em;text-transform:uppercase;color:#d8b46a;font-weight:600;margin-top:33px}
.tag{font-size:33px;color:#93a99b;font-weight:300;margin-top:78px;letter-spacing:.02em}
.foot{position:absolute;left:0;right:0;bottom:139px;text-align:center;
  font-size:24px;letter-spacing:.32em;text-transform:uppercase;color:#4f6357;font-weight:500}
</style></head><body>
<div class="center">
  <div class="badge"><svg viewBox="0 0 100 118" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="gsplash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0dcab"/><stop offset="0.55" stop-color="#d8b46a"/><stop offset="1" stop-color="#c79f57"/>
    </linearGradient>
  </defs>
  <g fill="url(#gsplash)" stroke="none">
    <!-- stem -->
    <rect x="47.5" y="46" width="5" height="60" rx="2.5"/>
    <!-- top bud (pointed leaf) -->
    <path d="M50 12 C55 26 55 40 50 50 C45 40 45 26 50 12 Z"/>
    <!-- leaf pairs -->
    <path d="M50 52 C36 50 26 41 22 30 C36 30 47 38 50 52 Z"/>
    <path d="M50 52 C64 50 74 41 78 30 C64 30 53 38 50 52 Z"/>
    <path d="M50 68 C34 66 23 56 19 44 C35 45 47 53 50 68 Z"/>
    <path d="M50 68 C66 66 77 56 81 44 C65 45 53 53 50 68 Z"/>
    <path d="M50 84 C36 82 27 73 24 62 C37 63 47 70 50 84 Z"/>
    <path d="M50 84 C64 82 73 73 76 62 C63 63 53 70 50 84 Z"/>
  </g>
</svg></div>
  <div class="wm">HLC Club</div>
  <div class="cl">Functional Eating Companion</div>
  <div class="tag">Eat sweet. Feel steady.</div>
</div>
<div class="foot">Healthy desserts first</div>
</body></html>
